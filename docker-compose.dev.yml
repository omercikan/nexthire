services:

  # =========================
  # IDENTITY SERVICE
  # =========================
  identity-service:
    build: ./services/identity-service
    container_name: identity-service-dev
    ports:
      - "8081:8080"
    environment:
      DB_URL: ${IDENTITY_DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}

    depends_on:
      identity-db:
        condition: service_healthy
    networks:
      - nexthire-network


  # =========================
  # IDENTITY DATABASE
  # =========================
  identity-db:
    image: postgres:16
    container_name: identity-db-dev
    environment:
      POSTGRES_DB: identity_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432"
    volumes:
      - identity-db-data-dev:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d identity_db" ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - nexthire-network


  # --- BACKEND (Node.js/Express) ---
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: backend
    restart: unless-stopped
    env_file:
      - ./backend/.env.dev
    ports:
      - "5000:5000"
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:5000/health || exit 1" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - nexthire-network

  # --- MESSAGE BROKER (RabbitMQ) ---
  rabbitmq:
    image: rabbitmq:4-management
    container_name: rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: nexthire
      RABBITMQ_DEFAULT_PASS: nexthire
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq/
    networks:
      - nexthire-network
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # --- WORKER (Node.js RabbitMQ Consumer) ---
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: worker
    command: npx ts-node src/queues/index.ts
    restart: unless-stopped
    env_file:
      - ./backend/.env.dev
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      rabbitmq:
        condition: service_healthy
      backend:
        condition: service_started
    networks:
      - nexthire-network

  # --- AI SERVICE (PYTHON) ---
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile.dev
    container_name: ai-service
    restart: unless-stopped
    env_file:
      - ./ai-service/.env
    volumes:
      - ./ai-service:/usr/src/app
    ports:
      - "8000:8000"
    networks:
      - nexthire-network

  # --- WORKER (PYTHON RabbitMQ Consumer for AI) ---
  ai-worker:
    build:
      context: ./ai-service
      dockerfile: Dockerfile.dev
    container_name: ai-worker
    restart: unless-stopped
    env_file:
      - ./ai-service/.env
    command: python -m app.workers.llm_consumer
    networks:
      - nexthire-network
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      - PYTHONUNBUFFERED=1

  # --- CACHE (Redis) ---
  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    volumes:
      - redis-data:/data
    networks:
      - nexthire-network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- REDIS UI (RedisInsight) ---
  redisinsight:
    image: redis/redisinsight:latest
    container_name: redisinsight
    restart: unless-stopped
    ports:
      - "5540:5540"
    networks:
      - nexthire-network
    depends_on:
      - redis

volumes:
  rabbitmq_data:
  identity-db-data-dev:
  redis-data:
    driver: local

networks:
  nexthire-network:
    driver: bridge
